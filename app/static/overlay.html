<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>49ers Live Gamecast — Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap">

  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/overlay.css">
  <link rel="stylesheet" href="/static/css/scoreboard.css">
  <link rel="stylesheet" href="/static/css/field.css">
  <link rel="stylesheet" href="/static/css/events.css">

  <script>
    // /overlay?preview mostra um fundo xadrez para enxergar as áreas transparentes no navegador.
    if (new URLSearchParams(location.search).has("preview")) {
      document.documentElement.classList.add("preview");
    }
  </script>
  <script type="module" src="/static/js/overlay.js"></script>
</head>
<body>
  <main class="overlay">

    <!-- Áreas transparentes: as câmeras são posicionadas por baixo, no OBS. -->
    <section class="cameras" aria-label="Câmeras">
      <div class="camera-slot" data-camera="1"></div>
      <div class="camera-slot" data-camera="2"></div>
      <div class="camera-slot" data-camera="3"></div>
    </section>

    <section class="gamecast">
      <header class="gamecast-header">
        <span class="gamecast-title">49ers Live Gamecast</span>
        <span class="phase-badge" data-bind="phase"></span>
      </header>

      <div class="scoreboard">
        <div class="team team--opponent" data-team="opponent">
          <div class="team-identity">
            <span class="team-abbr"><span data-bind="abbr"></span> <span class="possession-marker" aria-hidden="true"></span></span>
            <span class="team-name" data-bind="name"></span>
          </div>
          <span class="team-score" data-bind="score"></span>
        </div>

        <div class="game-clock">
          <span class="quarter" data-bind="quarter"></span>
          <span class="clock" data-bind="clock"></span>
        </div>

        <div class="team team--featured" data-team="featured">
          <div class="team-identity">
            <span class="team-abbr"><span class="possession-marker" aria-hidden="true"></span> <span data-bind="abbr"></span></span>
            <span class="team-name" data-bind="name"></span>
          </div>
          <span class="team-score" data-bind="score"></span>
        </div>
      </div>

      <div class="field">
        <div class="endzone endzone--left" data-endzone="left"></div>

        <div class="playing-field">
          <span class="yard-number" style="--y: 10">10</span>
          <span class="yard-number" style="--y: 20">20</span>
          <span class="yard-number" style="--y: 30">30</span>
          <span class="yard-number" style="--y: 40">40</span>
          <span class="yard-number" style="--y: 50">50</span>
          <span class="yard-number" style="--y: 60">40</span>
          <span class="yard-number" style="--y: 70">30</span>
          <span class="yard-number" style="--y: 80">20</span>
          <span class="yard-number" style="--y: 90">10</span>

          <span class="marker marker--los" data-marker="los" title="Line of scrimmage"></span>
          <span class="marker marker--first-down" data-marker="first-down" title="First down"></span>
          <span class="ball" data-marker="ball"></span>
        </div>

        <div class="endzone endzone--right" data-endzone="right"></div>
      </div>

      <div class="event-callout" hidden>
        <span class="event-title" data-bind="event-title"></span>
        <span class="event-team" data-bind="event-team"></span>
        <span class="event-points" data-bind="event-points"></span>
      </div>

      <div class="situation">
        <span class="situation-possession" data-bind="possession"></span>
        <span class="situation-down" data-bind="down"></span>
        <span class="situation-spot" data-bind="spot"></span>
      </div>

      <div class="last-play">
        <span class="last-play-label">Última jogada</span>
        <p class="last-play-text">
          <span data-bind="last-play"></span>
          <span class="last-play-yards" data-bind="last-play-yards"></span>
        </p>
      </div>
    </section>

    <footer class="banner">Deixa o like e se inscreva</footer>

  </main>
</body>
</html>
